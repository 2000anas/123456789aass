[build]
  command = "npm ci && npm run build"
  publish = "dist/web"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"
  NPM_CONFIG_PRODUCTION = "false"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "vite"
  targetPort = 5173
  port = 8888
  autoLaunch = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
